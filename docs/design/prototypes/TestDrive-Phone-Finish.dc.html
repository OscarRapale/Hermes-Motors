<body>

<span class="pf-chip"><span>S2</span><b style="font-weight: 400; color: {{s2c}}">{{s2}}</b></span>

<div style="position: absolute; left: 0; right: 0; top: 15px; display: flex; justify-content: center; align-items: center; gap: 6px">
<svg viewBox="0 0 120 80" width="18" height="12" aria-hidden="true"><path d="M50,72 L64,72 L80,8 L66,8 Z M78,72 L92,72 L108,8 L94,8 Z M70,46 L86,46 L88.5,36 L72.5,36 Z" style="fill: #F4F4F5"/><path d="M59,23 L57,32 L13,18 L6,10 Z M55.5,38 L53.5,46.5 L20,35.5 L14,27.5 Z M52,53 L50,61 L29,53.5 L24,45.5 Z" style="fill: var(--accent, #D5121E)"/></svg>

<span class="pf-mich" style="font-size: 10.5px; line-height: 1.25; letter-spacing: 0.02em">{{c1}}<br>{{c2}}</span>
<span class="pf-mono" style="font-size: 34px; font-weight: 500; line-height: 1; letter-spacing: -0.03em">{{cardNum}}<span style="font-size: 11px; margin-left: 3px; color: var(--accent, #D5121E)">S</span></span>
</div>
<svg viewBox="0 0 280 190" aria-hidden="true" style="position: absolute; left: 15px; top: 214px; width: 78px; height: auto">
<path d="M52,160 L196,160 C236,160 256,146 252,124 C249,108 230,104 214,106 C196,108 186,96 192,82 C198,68 222,66 238,56 C254,46 252,24 232,20 C204,14 168,30 148,44 C130,56 112,54 100,40 C88,26 64,18 44,30 C28,40 30,62 46,74 C60,84 60,100 44,110 C28,120 22,140 30,152 C35,159 42,160 52,160 Z" style="fill: none; stroke: var(--accent, #D5121E); stroke-width: 9; stroke-linejoin: round"/>
</svg>
<span class="pf-mono" style="position: absolute; left: 15px; bottom: 15px; font-size: 7.5px; line-height: 1.6; letter-spacing: 0.12em; color: #C9CDD3">YOU {{lap}}<br>MESSENGER 1:11.906</span></figure>

<div style="position: absolute; left: 24px; right: 24px; top: 716px; display: flex; gap: 10px">
<a href="#" style="flex: 1; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px; background: {{p1Bg}}; border: 1px solid {{p1Border}}; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">{{p1}}</a>
<a href="#" style="flex: 1; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.22); color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 600">{{p2}}</a>
</div>
<p class="pf-mono" style="position: absolute; left: 0; right: 0; top: 782px; margin: 0; text-align: center; font-size: 10px; letter-spacing: 0.08em; color: #8E939C">Shares as a story. No sign-up, no database.</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"won":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#D5121E","options":["#D5121E","#E8432E","#A30F1F","#0E0F11"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var won = this.props.won !== false;
    var accent = this.props.accent || '#D5121E';
    var PURPLE = '#C9A0FF', YELLOW = '#F2C94C';
    var gaps = won ? [0.422, -0.088, -0.548] : [0.281, -0.1, -0.029];
    var f = function (g) { return (g < 0 ? '−' : '+') + Math.abs(g).toFixed(3); };
    return {
      accent: accent,
      h1: won ? 'YOU BEAT THE' : 'THE MESSENGER',
      h2: won ? 'MESSENGER.' : 'HOLDS ON.',
      delta: won ? '−0.214' : '+0.152',
      deltaColor: won ? '#5BE58F' : '#FF5A63',
      lap: won ? '1:11.692' : '1:12.058',
      s1: f(gaps[0]), s2: f(gaps[1]), s3: f(gaps[2]),
      s1c: gaps[0] < 0 ? PURPLE : YELLOW, s2c: gaps[1] < 0 ? PURPLE : YELLOW, s3c: gaps[2] < 0 ? PURPLE : YELLOW,
      c1: won ? 'I BEAT THE' : 'I CHASED THE',
      c2: won ? 'MESSENGER BY' : 'MESSENGER TO',
      cardNum: won ? '0.214' : '0.152',
      cardLabel: won ? 'Story card: I beat the messenger by 0.214 seconds' : 'Story card: I chased the messenger to 0.152 seconds',
      p1: won ? 'Share your card' : 'Run it back',
      p2: won ? 'Run it back' : 'Share',
      p1Bg: accent,
      p1Border: accent
    };
  }
}
</script>
</body>
</html>
