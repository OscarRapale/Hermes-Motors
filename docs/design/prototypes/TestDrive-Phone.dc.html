<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hermes Motors — Test drive v2 on a phone (landscape)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Michroma&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tp-mono{font-family:'Geist Mono',ui-monospace,monospace}
.tp-glass{background:linear-gradient(180deg,rgba(34,35,40,.64) 0%,rgba(12,13,15,.76) 100%);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.14);box-sizing:border-box}
.tp-pad{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0;color:#FFFFFF;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none;transition:transform .08s ease-out}
.tp-pad span{font-family:'Geist Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.14em}
</style>
</helmet>
<div style="--accent: {{accent}}; position: relative; width: 844px; height: 390px; overflow: hidden; border-radius: 28px; background: #E3E6EA; color: #F4F4F5; font-family: 'Geist', 'Helvetica Neue', Arial, sans-serif">

<img src="../../../vendor/assets/images/drive-phone.webp" alt="Chase camera behind the HM-27 on the Proving Ground straight, the messenger's ghost car ahead in red" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block">

<div aria-hidden="true" style="position: absolute; left: 388px; top: 172px; transform: translate(-50%, -100%); display: {{tagShow}}; flex-direction: column; align-items: center">
<div class="tp-glass" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 5px 9px; border-radius: 11px">
<span class="tp-mono" style="display: flex; align-items: center; gap: 6px; font-size: 9px; letter-spacing: 0.12em; white-space: nowrap"><span style="width: 6px; height: 6px; border-radius: 50%; background: #FF5A63; box-shadow: 0 0 6px #FF5A63"></span>THE MESSENGER<span style="color: {{deltaColor}}">{{tagGap}}</span></span>
<span class="tp-mono" style="display: {{otTagShow}}; font-size: 7.5px; letter-spacing: 0.12em; white-space: nowrap">WITHIN 1 S · OVERTAKE READY</span>
</div>
<span style="width: 1px; height: 10px; background: rgba(255,90,99,.8)"></span>
</div>

<section class="tp-glass" aria-label="Lap timing" style="position: absolute; left: 44px; top: 12px; padding: 7px 14px 8px; border-radius: 16px; display: flex; flex-direction: column; gap: 3px">
<span class="tp-mono" style="font-size: 8.5px; letter-spacing: 0.16em; color: #FF5A63; white-space: nowrap">BEAT THE MESSENGER · {{attempt}}</span>
<span style="display: flex; align-items: baseline; gap: 10px"><span class="tp-mono" role="timer" style="font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums">{{cur}}</span><span class="tp-mono" style="font-size: 9px; letter-spacing: 0.08em; color: #C9CDD3">BEST {{best}}</span></span>
<span class="tp-mono" style="display: flex; align-items: center; gap: 6px; font-size: 8px; letter-spacing: 0.12em; color: #C9CDD3"><span style="padding: 2px 6px; border-radius: 999px; background: {{aeroBg}}; color: {{aeroInk}}; border: 1px solid {{aeroBorder}}">{{aero}}</span>ERS {{ers}}%<span style="width: 34px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.14); position: relative; overflow: hidden"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ers}}%; background: #FFFFFF"></span></span></span>
</section>

<section class="tp-glass" aria-label="{{speedLabel}}" style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 7px 12px 8px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<div aria-hidden="true" style="display: flex; gap: 3px">
<sc-for list="{{leds}}" as="led" hint-placeholder-count="15"><span style="width: 9px; height: 3px; border-radius: 2px; background: {{led.bg}}; opacity: {{led.op}}; box-shadow: {{led.glow}}"></span></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 9px">
<span class="tp-mono" style="font-size: 24px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; min-width: 44px; text-align: right">{{speed}}</span>
<span class="tp-mono" style="font-size: 8px; letter-spacing: 0.16em; color: #C9CDD3">KM/H</span>
<span style="width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: #FFFFFF; color: #0E0F11; font-family: 'Michroma', 'Eurostile', sans-serif; font-size: 14px">{{gear}}</span>
<span style="width: 1px; height: 20px; background: rgba(255,255,255,.2)"></span>
<span class="tp-mono" style="font-size: 8px; letter-spacing: 0.14em; color: #C9CDD3">Δ</span>
<span class="tp-mono" style="font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; color: {{deltaColor}}; min-width: 52px">{{delta}}</span>
</div>
</section>

<div style="position: absolute; right: 44px; top: 12px; display: flex; gap: 8px; align-items: flex-start">
<div class="tp-glass" role="img" aria-label="Track map with your car and the messenger" style="width: 112px; padding: 7px 9px; border-radius: 14px">
<svg viewBox="0 0 280 190" style="width: 100%; height: auto; display: block" aria-hidden="true">
<path d="M52,160 L196,160 C236,160 256,146 252,124 C249,108 230,104 214,106 C196,108 186,96 192,82 C198,68 222,66 238,56 C254,46 252,24 232,20 C204,14 168,30 148,44 C130,56 112,54 100,40 C88,26 64,18 44,30 C28,40 30,62 46,74 C60,84 60,100 44,110 C28,120 22,140 30,152 C35,159 42,160 52,160 Z" style="fill: none; stroke: rgba(255,255,255,.18); stroke-width: 14; stroke-linejoin: round"/>
<path d="M52,160 L196,160 C236,160 256,146 252,124 C249,108 230,104 214,106 C196,108 186,96 192,82 C198,68 222,66 238,56 C254,46 252,24 232,20 C204,14 168,30 148,44 C130,56 112,54 100,40 C88,26 64,18 44,30 C28,40 30,62 46,74 C60,84 60,100 44,110 C28,120 22,140 30,152 C35,159 42,160 52,160 Z" pathLength="1000" style="fill: none; stroke: var(--accent, #D5121E); stroke-width: 7; stroke-linecap: round; stroke-dasharray: {{trace}} 1000"/>
<circle cx="{{gX}}" cy="{{gY}}" r="11" style="fill: rgba(255,90,99,.2); stroke: #FF5A63; stroke-width: 3.5; stroke-dasharray: 5 3"/>
<circle cx="{{dotX}}" cy="{{dotY}}" r="10" style="fill: #FFFFFF; stroke: var(--accent, #D5121E); stroke-width: 4"/>
</svg>
</div>
<button type="button" onClick="{{pause}}" aria-label="{{pauseLabel}}" class="tp-glass" style="width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border-radius: 50%; color: #F4F4F5; cursor: pointer">
<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="display: {{pauseIcon}}"><path d="M9 6v12M15 6v12" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"/></svg>
<svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="display: {{resumeIcon}}"><path d="M8 5.5v13l10.5-6.5Z" style="fill: currentColor"/></svg>
</button>
</div>

<button type="button" onClick="{{start}}" class="tp-glass" style="position: absolute; left: 50%; top: 84px; transform: translateX(-50%); display: {{playShow}}; align-items: center; gap: 8px; height: 38px; padding: 0 15px 0 12px; border-radius: 999px; color: #FFFFFF; font: 600 13px 'Geist', 'Helvetica Neue', Arial, sans-serif; cursor: pointer">
<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 4.5v15l12-7.5Z" style="fill: var(--accent, #D5121E)"/></svg>Play the start
</button>

<div class="tp-glass" role="status" aria-label="{{lightsLabel}}" style="position: absolute; left: 50%; top: 82px; transform: translateX(-50%); display: {{lightsShow}}; flex-direction: column; align-items: center; gap: 8px; padding: 11px 16px 9px; border-radius: 20px">
<div aria-hidden="true" style="display: flex; gap: 10px">
<sc-for list="{{lamps}}" as="l" hint-placeholder-count="5"><span style="width: 30px; height: 30px; border-radius: 50%; background: {{l.bg}}; box-shadow: {{l.glow}}; border: 2px solid rgba(255,255,255,.08)"></span></sc-for>
</div>
<span class="tp-mono" style="font-size: 9px; letter-spacing: 0.22em; color: {{lightsInk}}">{{lightsCaption}}</span>
</div>

<div class="tp-mono" role="status" style="position: absolute; left: 50%; top: 84px; transform: translateX(-50%); display: {{fxShow}}; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 999px; background: var(--accent, #D5121E); color: #FFFFFF; font-size: 10px; letter-spacing: 0.16em; box-shadow: 0 10px 24px -10px var(--accent, #D5121E)">{{fxText}}</div>

<div style="position: absolute; left: 44px; bottom: 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px">
<span class="tp-mono tp-glass" style="padding: 4px 9px; border-radius: 999px; font-size: 8px; letter-spacing: 0.14em; color: #C9CDD3">STEER · BUTTONS · TILT IN SETTINGS</span>
<div style="display: flex; gap: 12px">
<button type="button" onClick="{{left}}" aria-label="Steer left" class="tp-glass tp-pad" style="width: 66px; height: 66px; border-radius: 50%; transform: scale({{lScale}}); border-color: {{lRing}}"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"/></svg></button>
<button type="button" onClick="{{right}}" aria-label="Steer right" class="tp-glass tp-pad" style="width: 66px; height: 66px; border-radius: 50%; transform: scale({{rScale}}); border-color: {{rRing}}"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M9 5l7 7-7 7" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"/></svg></button>
</div>
</div>

<div style="position: absolute; right: 44px; bottom: 16px; display: flex; align-items: flex-end; gap: 12px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 9px">
<div style="display: flex; gap: 9px; align-items: flex-end">
<button type="button" onClick="{{boost}}" aria-label="Boost" class="tp-glass tp-pad" style="width: 46px; height: 46px; border-radius: 50%; background: {{boostBg}}; border-color: {{boostBorder}}"><span>BST</span></button>
<button type="button" onClick="{{overtake}}" aria-label="{{otLabel}}" class="tp-glass tp-pad" style="width: 54px; height: 54px; border-radius: 50%; background: {{otBg}}; border: 1.5px solid {{otBorder}}; color: {{otInk}}"><span style="font-size: 10px">OT</span></button>
</div>
<button type="button" onClick="{{brake}}" aria-label="Brake" class="tp-glass tp-pad" style="width: 64px; height: 84px; border-radius: 22px; transform: scale({{bScale}}); border-color: {{bRing}}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h10" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"/></svg><span>BRAKE</span></button>
</div>
<button type="button" onClick="{{throttle}}" aria-label="Throttle" class="tp-pad" style="width: 70px; height: 120px; border-radius: 24px; background: var(--accent, #D5121E); border: 1px solid rgba(255,255,255,.3); box-shadow: 0 14px 30px -12px color-mix(in srgb, var(--accent, #D5121E) 80%, transparent), inset 0 1px 0 rgba(255,255,255,.3); transform: scale({{tScale}})"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 19V6M6 11l6-6 6 6" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"/></svg><span>THROTTLE</span></button>
</div>

<section class="tp-glass" aria-label="Lap result" style="position: absolute; left: 50%; top: 96px; transform: translateX(-50%); display: {{doneShow}}; flex-direction: column; align-items: center; gap: 8px; width: 330px; padding: 16px 18px; border-radius: 22px; text-align: center">
<span class="tp-mono" style="font-size: 9px; letter-spacing: 0.22em; color: #FF5A63">LAP COMPLETE</span>
<span style="font-family: 'Michroma', 'Eurostile', sans-serif; font-size: 15px; letter-spacing: 0.02em">YOU BEAT THE MESSENGER</span>
<span class="tp-mono" style="font-size: 34px; font-weight: 500; line-height: 1; color: #5BE58F">−0.214<span style="font-size: 12px; margin-left: 4px; color: #C9CDD3">S</span></span>
<div style="display: flex; gap: 8px; margin-top: 4px">
<button type="button" onClick="{{start}}" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--accent, #D5121E); color: #FFFFFF; font: 600 13px 'Geist', 'Helvetica Neue', Arial, sans-serif; cursor: pointer">Run it back</button>
<button type="button" onClick="{{exit}}" style="height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); background: rgba(255,255,255,.06); color: #FFFFFF; font: 600 13px 'Geist', 'Helvetica Neue', Arial, sans-serif; cursor: pointer">Share card</button>
</div>
</section>

</div>
</x-dc>

    while (g < 8 && speed >= GEARS[g]) g++;
    var rpm = grid ? 9800 : 7200 + Math.min(1, (speed - GEARS[g - 1]) / (GEARS[g] - GEARS[g - 1])) * 4600;
    var lit = Math.max(0, Math.min(15, Math.round((rpm - 7000) / 5000 * 15)));
    var leds = [];
    for (var k = 0; k < 15; k++) {
      var col = k < 5 ? '#FFFFFF' : accent, on = k < lit;
      leds.push({ bg: col, op: on ? 1 : 0.2, glow: on ? '0 0 6px ' + col : 'none' });
    }
    var lamps = [];
    for (var n = 0; n < 5; n++) {
      var hot = grid && n < s.lights;
      lamps.push({ bg: hot ? '#FF2B2B' : '#26282D', glow: hot ? '0 0 14px rgba(255,43,43,.9), inset 0 0 6px rgba(255,255,255,.35)' : 'inset 0 2px 5px rgba(0,0,0,.6)' });
    }
    var at = function (q) {
      var f = Math.max(0, Math.min(0.99999, q)) * 120, i0 = Math.floor(f) % 120, i1 = (i0 + 1) % 120, fr = f - Math.floor(f);
      return [self.PTS[i0][0] + (self.PTS[i1][0] - self.PTS[i0][0]) * fr, self.PTS[i0][1] + (self.PTS[i1][1] - self.PTS[i0][1]) * fr];
    };
    var me = at(p), gh = at(pg);
    var showGap = !grid;
    var ready = showGap && s.mode !== 'done' && gap > 0 && gap <= 1;
    var otOn = s.fx === 'overtake', boostOn = s.fx === 'boost';
    var straight = !grid && v > 250 && dv >= -1;
    var pressScale = function (w) { return s.press === w ? '0.94' : '1'; };
    var pressRing = function (w) { return s.press === w ? 'rgba(255,255,255,.7)' : 'rgba(255,255,255,.16)'; };
    return {
      accent: accent,
      attempt: 'ATTEMPT ' + s.attempt,
      cur: fmt(t),
      best: fmt(s.best),
      delta: showGap ? (gap < 0 ? '−' : '+') + Math.abs(gap).toFixed(3) : '—',
      deltaColor: !showGap ? '#C9CDD3' : gap < 0 ? GREEN : RED,
      tagShow: showGap && s.mode !== 'done' ? 'flex' : 'none',
      tagGap: (gap < 0 ? '−' : '+') + Math.abs(gap).toFixed(2) + ' S',
      otTagShow: ready && !otOn ? 'block' : 'none',
      speed: String(speed),
      speedLabel: speed + ' kilometres per hour, gear ' + (grid ? 'neutral' : g),
      gear: grid ? 'N' : String(g),
      leds: leds,
      ers: ers,
      aero: straight ? 'STRAIGHT' : 'CORNER',
      aeroBg: straight ? '#F4F4F5' : 'transparent',
      aeroInk: straight ? '#0E0F11' : '#C9CDD3',
      aeroBorder: straight ? '#F4F4F5' : 'rgba(255,255,255,.3)',
      trace: (p * 1000).toFixed(1),
      dotX: me[0].toFixed(1), dotY: me[1].toFixed(1),
      gX: gh[0].toFixed(1), gY: gh[1].toFixed(1),
      playShow: s.mode === 'snap' && !s.fx ? 'inline-flex' : 'none',
      lightsShow: grid || s.go ? 'flex' : 'none',
      lamps: lamps,
      lightsCaption: s.go ? 'LIGHTS OUT AND AWAY' : 'WAIT FOR LIGHTS OUT',
      lightsInk: s.go ? '#FFFFFF' : '#C9CDD3',
      lightsLabel: s.go ? 'Lights out' : s.lights + ' of 5 start lights on',
      fxShow: s.fx && !grid && !s.go ? 'inline-flex' : 'none',
      fxText: otOn ? 'OVERTAKE ON · +0.5 MJ' : boostOn ? 'BOOST · DEPLOYING' : '',
      otBg: otOn ? accent : ready ? 'color-mix(in srgb, ' + accent + ' 30%, rgba(12,13,15,.7))' : '',
      otBorder: ready || otOn ? accent : 'rgba(255,255,255,.2)',
      otInk: ready || otOn ? '#FFFFFF' : '#9EA3AB',
      otLabel: ready ? 'Overtake, ready' : 'Overtake, unlocks within one second of the messenger',
      boostBg: boostOn ? accent : '',
      boostBorder: boostOn ? accent : 'rgba(255,255,255,.2)',
      lScale: pressScale('left'), rScale: pressScale('right'), bScale: pressScale('brake'), tScale: pressScale('throttle'),
      lRing: pressRing('left'), rRing: pressRing('right'), bRing: pressRing('brake'),
      doneShow: s.mode === 'done' ? 'flex' : 'none',
      pauseLabel: s.mode === 'live' ? (s.paused ? 'Resume' : 'Pause') : 'Exit the test drive',
      pauseIcon: s.mode === 'live' && s.paused ? 'none' : 'block',
      resumeIcon: s.mode === 'live' && s.paused ? 'block' : 'none',
      start: function () { self.start(); },
      pause: function () { self.pause(); },
      exit: function () { self.exit(); },
      overtake: function () { if (ready) self.effect('overtake'); },
      boost: function () { if (!grid && s.mode !== 'done') self.effect('boost'); },
      left: function () { self.tap('left'); },
      right: function () { self.tap('right'); },
      brake: function () { self.tap('brake'); },
      throttle: function () { self.tap('throttle'); }
    };
  }
}
</script>
</body>
